name: APK from ZIP

# Распаковывает zip-архив проекта из корня репозитория и собирает APK.
# Запуск: Actions -> APK from ZIP -> Run workflow, либо при загрузке нового .zip.

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          ZIP=$(ls -1 ./*.zip | head -1)
          echo "Using $ZIP"
          mkdir work
          unzip -q "$ZIP" -d work
          PROJECT=$(dirname "$(find work -name pubspec.yaml | head -1)")
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project dir: $PROJECT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Кэш Gradle и пакетов Dart: без него каждый запуск скачивает всё заново.
      - name: Cache Gradle and Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: android-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            android-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android platform files
        run: |
          cd "$PROJECT"
          flutter create --project-name invest_trainer --org ru.investacademy --platforms=android .

      - name: Get packages
        working-directory: ${{ env.PROJECT }}
        run: flutter pub get

      - name: Analyze (info does not block)
        working-directory: ${{ env.PROJECT }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      # Только arm64: это ускоряет сборку в несколько раз и подходит практически всем телефонам.
      - name: Build APK (arm64)
        working-directory: ${{ env.PROJECT }}
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: invest-trainer-apk
          path: ${{ env.PROJECT }}/build/app/outputs/flutter-apk/app-release.apk

  test:
    # Отдельная задача: падение или зависание тестов не мешает сборке APK.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          ZIP=$(ls -1 ./*.zip | head -1)
          mkdir work
          unzip -q "$ZIP" -d work
          PROJECT=$(dirname "$(find work -name pubspec.yaml | head -1)")
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get packages
        working-directory: ${{ env.PROJECT }}
        run: flutter pub get

      - name: Test
        working-directory: ${{ env.PROJECT }}
        timeout-minutes: 15
        # --concurrency=1: тесты по одному, чтобы не падал компилятор от нехватки памяти
        #  и не мешали друг другу временные папки.
        run: flutter test --reporter expanded --concurrency=1
